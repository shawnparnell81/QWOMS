<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="spread/package/styles/gc.spread.sheets.excel2016colorful.css"></head><body>
<p>LOCAL EVALUATION ONLY — SYNTHETIC WORKBOOK. NOT PART OF QWOMS DEPLOYMENT.</p><input type="file" id="input"><button id="export">Export evaluation workbook</button><div id="sheet" style="width:1200px;height:800px"></div>
<script src="spread/package/dist/gc.spread.sheets.all.min.js"></script><script src="print/package/dist/gc.spread.sheets.print.min.js"></script><script src="shapes/package/dist/gc.spread.sheets.shapes.min.js"></script><script src="native-io/package/dist/gc.spread.sheets.io.min.js"></script>
<script>
const workbook=new GC.Spread.Sheets.Workbook(document.getElementById('sheet'));window.loaded=false;window.problem=null;
document.getElementById('input').onchange=e=>workbook.import(e.target.files[0],()=>{window.loaded=true},error=>window.problem=String(error),{fileType:GC.Spread.Sheets.FileType.excel});
document.getElementById('export').onclick=()=>workbook.export(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Synthetic native IO round-trip.xlsx';a.click()},error=>window.problem=String(error),{fileType:GC.Spread.Sheets.FileType.excel});
</script></body></html>
