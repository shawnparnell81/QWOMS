<!doctype html><html><head><link rel="stylesheet" href="spread/package/styles/gc.spread.sheets.excel2013white.css"></head><body><p>LOCAL SYNTHETIC EVALUATION ONLY — NOT QWOMS DEPLOYMENT.</p><input type="file" id="input"><button id="export">Export evaluation workbook</button><div id="sheet" style="width:1200px;height:800px"></div><script src="spread/package/dist/gc.spread.sheets.all.min.js"></script><script src="print/package/dist/gc.spread.sheets.print.min.js"></script><script src="shapes/package/dist/gc.spread.sheets.shapes.min.js"></script><script src="io/package/dist/gc.spread.excelio.min.js"></script><script>
const workbook=new GC.Spread.Sheets.Workbook(document.getElementById('sheet'));const io=new GC.Spread.Excel.IO();window.loaded=false;window.problem=null;document.getElementById('input').onchange=e=>io.open(e.target.files[0],json=>{window.importedJSON=json;workbook.fromJSON(json);window.loaded=true;const s=workbook.getActiveSheet();window.diagnostics={pictures:s.pictures.all().length,rules:s.conditionalFormats.getRules().map(r=>r.toJSON()),print:s.printInfo().toJSON()};},error=>window.problem=String(error),{importPictureAsFloatingObject:new URLSearchParams(location.search).get('floating')==='true'});document.getElementById('export').onclick=()=>io.save(workbook.toJSON(),blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Synthetic round-trip.xlsx';a.click()},error=>window.problem=String(error));
</script></body></html>
