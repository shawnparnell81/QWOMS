# Local synthetic-data development only. Cloud deployment needs approved TLS/storage/backup policy.
x-app: &app
  image: qwoms-development:local
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://qwoms:${QWOMS_DB_PASSWORD:?Generate .env.docker first}@db:5432/qwoms
    QWOMS_SECRET_KEY: ${QWOMS_SECRET_KEY:?Generate .env.docker first}
    QWOMS_COOKIE_SECURE: "false"
    QWOMS_STORAGE_ROOT: /data
    QWOMS_STORAGE_BACKEND: local
  volumes:
    - documents:/data
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: qwoms
      POSTGRES_DB: qwoms
      POSTGRES_PASSWORD: ${QWOMS_DB_PASSWORD:?Generate .env.docker first}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwoms -d qwoms"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres:
  documents:
